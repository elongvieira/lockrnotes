name: Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to build
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.repository_owner == 'elongvieira' }}
    runs-on: windows-latest

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Node and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm install
          npm run postinstall
          npm run build

      - name: Publish releases
        env:
          # Unsigned build. A Windows code-signing certificate is optional.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_GH_IGNORE_TIME: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec electron-builder -- --publish always --win
