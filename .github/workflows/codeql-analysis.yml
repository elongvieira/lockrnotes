name: 'CodeQL'

# CodeQL is disabled - requires code scanning to be enabled in GitHub repository settings
# To re-enable: uncomment the 'on' block below and enable code scanning at:
# https://github.com/elongvieira/lockrnotes/settings/security_analysis
on:
  workflow_dispatch: # manual trigger only

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
