name: Bug report
description: Report a technical problem in Lockr Notes.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security vulnerability, stop here and use a [private security advisory](https://github.com/elongvieira/lockrnotes/security/advisories/new).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I am using the latest release, or an up-to-date `main` branch.
          required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Stack traces or console output, if you have them. Leave out passwords, tokens, and note contents.
      render: text
  - type: input
    id: version
    attributes:
      label: Lockr Notes version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Only needed if you are running from source.
      placeholder: "22"
